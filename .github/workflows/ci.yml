name: Student Management CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Give Permission to Maven
        run: chmod +x mvnw

      - name: Build and Test Project
        run: ./mvnw clean verify

      - name: Show Test Failure Details
        if: failure()
        run: |
              echo "===== TEST REPORT ====="
              cat target/surefire-reports/*.txt || true